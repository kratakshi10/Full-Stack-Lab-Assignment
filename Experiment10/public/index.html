<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🛍️ Product Dashboard</h1>
        <p>Explore and manage your products</p>
    </header>

    <main class="container">

        <section class="form-box">
            <h2>➕ Add New Product</h2>

            <form id="productForm">
                <input type="text" id="name"
                       placeholder="Product Name" required>

                <input type="number" id="price"
                       placeholder="Price (₹)" min="0.01" step="0.01" required>

                <input type="number" id="rating"
                       placeholder="Rating (0-5)" min="0" max="5" step="0.1" required>

                <button type="submit">Add Product</button>
            </form>

            <p id="message"></p>
        </section>

        <section>
            <h2>Available Products</h2>

            <div id="productList" class="product-grid"></div>
        </section>

    </main>

    <footer>
        <p>Product API | Full Stack Development Lab</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
