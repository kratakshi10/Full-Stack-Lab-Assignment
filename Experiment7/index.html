<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🎓 University Finder</h1>
        <p>Find universities from different countries</p>

        <div class="search-box">
            <input type="text" id="country" placeholder="Enter country name">
            <button onclick="searchUniversities()">Search</button>
        </div>

        <p id="message"></p>

        <div id="universityList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
